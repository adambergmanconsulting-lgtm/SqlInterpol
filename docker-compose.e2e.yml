version: '3.8'

services:
  Firebird:
    image: jacobalberty/firebird:3.0
    environment:
      ISC_PASSWORD: ${E2E_FIREBIRD_PASSWORD:-masterkey}
    ports:
      - "3050:3050"

  MySql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${E2E_DB_PASSWORD:-Password123!}
      MYSQL_DATABASE: ${E2E_DB_NAME:-sqlinterpol_test}
    ports:
      - "3306:3306"

  Oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${E2E_DB_PASSWORD:-Password123!}
      APP_USER: ${E2E_DB_USER:-sqlinterpol_user}
      APP_USER_PASSWORD: ${E2E_DB_PASSWORD:-Password123!}
    ports:
      - "1521:1521"

  PostgreSQL:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${E2E_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:-Password123!}
      POSTGRES_DB: ${E2E_DB_NAME:-sqlinterpol_test}
    ports:
      - "5432:5432"

  SqLite:
    image: alpine:latest
    command: "true"

  SqlServer:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${E2E_DB_PASSWORD:-Password123!}
    ports:
      - "1433:1433"